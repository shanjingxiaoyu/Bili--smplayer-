# ==============================================================================
# BiliYTPlayer — mpv 便携配置
# 针对 B 站 DASH 直链、杜比视界、高刷显示器优化
# ==============================================================================

# ── 视频输出 ──────────────────────────────────────────────────────────────────
vo=gpu-next
gpu-context=d3d11
gpu-api=d3d11

# YouTube 画质：最高视频+最高音频分轨，回退合并流
ytdl-format=bestvideo+bestaudio/best

# HDR / Dolby Vision 色调映射
# 优先从显示器 EDID 自动检测 HDR 亮度；检测不到则按 800 nits（高端 OLED）
target-colorspace-hint=yes
target-peak=800
tone-mapping=bt.2446a
hdr-compute-peak=yes

# 图像质量
dither-depth=10
deband=yes
deband-iterations=3
deband-threshold=48
deband-range=16

# 硬件解码（DXVA2 或 d3d11va；注释掉则用软解）
# hwdec=d3d11va
# hwdec-codecs=all

# ── 视频同步：消除高刷显示器播 24fps 的丢帧 ──────────────────────────────────
# display-resample：根据显示器刷新率动态调整音视频同步
video-sync=display-resample
# 插帧（让 24fps 在 90/120/144Hz 屏幕上更平滑）
interpolation=yes
tscale=oversample
# 允许小幅变速以匹配显示器（不会听出音调变化）
video-sync-max-video-change=5

# ── 音频 ─────────────────────────────────────────────────────────────────────
ao=wasapi
audio-exclusive=no
audio-channels=auto
# Dolby Atmos / E-AC-3 直通（如果音频设备支持）
# audio-spdif=ac3,eac3,dts,dts-hd,truehd
volume=100
volume-max=200

# ── 网络流缓冲（对 B 站 DASH CDN 很重要）────────────────────────────────────
cache=yes
cache-secs=30
demuxer-max-bytes=150M
demuxer-max-back-bytes=75M
# 降低缓冲时的停顿
cache-pause-initial=yes
# 提前预读
prefetch-playlist=yes

# ── 窗口行为 ─────────────────────────────────────────────────────────────────
keep-open=yes
keepaspect=yes
ontop=yes
# 窗口大小：默认 75% 屏幕
autofit-larger=75%x75%

# ── 字幕 / OSD ───────────────────────────────────────────────────────────────
sub-auto=fuzzy
sub-file-paths=subs:subtitles
# 显示当前时间 / 总时长
osd-duration=2000
osd-font-size=24
osd-bar-h=2
# 简洁模式：只显示时间
osd-playing-msg="${media-title}"
osd-level=1

# ── 截图 ─────────────────────────────────────────────────────────────────────
screenshot-format=png
screenshot-directory=~~desktop/
screenshot-high-bit-depth=yes
screenshot-tag-colorspace=yes

# ── 恢复播放位置（同文件不重复从头播）────────────────────────────────────────
save-position-on-quit=yes
# 但 B 站 CDN URL 是临时的，所以仅对本地文件生效
# （网络流靠文件名匹配，CDN URL 每次都不同，所以实际不会匹配）

# ── 日志 ─────────────────────────────────────────────────────────────────────
msg-level=all=status
